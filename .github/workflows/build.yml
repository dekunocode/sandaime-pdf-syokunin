# push と pull request のたびに、ビルドとテストを実行する。
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PdfSyokuninAvalonia.slnx -p:Configuration=Release

      - name: Build
        run: dotnet build PdfSyokuninAvalonia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test PdfSyokuninAvalonia.slnx -c Release --no-build
