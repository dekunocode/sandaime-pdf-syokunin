# README 用のスクリーンショットを撮る（手動実行）。
# Actions → Screenshot → Run workflow で実行し、Artifacts の screenshot.png をダウンロードする。
name: Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Take screenshot
        run: dotnet run --project tools/Screenshot -c Debug -- out/screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: out/screenshot.png
